version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-commander-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_pass}
      POSTGRES_DB: ${POSTGRES_DB:-incident_commander}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - incident_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_user} -d ${POSTGRES_DB:-incident_commander}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  incident_pg_data:
